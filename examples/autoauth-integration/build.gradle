plugins {
    id 'java'
    id 'application'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
application { mainClass = 'example.IntegrationApplication' }

// Adapt the older AutoAuth dependency declarations in this consumer only.
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('org.springframework.boot:spring-boot-starter-aop') using module('org.springframework.boot:spring-boot-starter-aspectj:4.1.2')
        substitute module('org.springframework.boot:spring-boot-starter-web') using module('org.springframework.boot:spring-boot-starter-webmvc:4.1.2')
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation('com.autoauth:autoauth:1.0.3-SNAPSHOT') {
        // AutoAuth's Swagger 2.x starter targets Boot 3.
        // This consumer demonstrates authentication and quotas without that optional UI.
        exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webmvc-ui'
    }
    implementation 'io.github.autosprings:autolimit:1.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
