plugins {
    id 'java'
    id 'application'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
application { mainClass = 'example.IntegrationApplication' }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.4')
    implementation('com.autoauth:autoauth:1.0.3-SNAPSHOT') {
        // The source library's existing Swagger starter selects newer Boot components.
        // This consumer demonstrates authentication and quotas without that optional UI.
        exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webmvc-ui'
    }
    implementation 'com.autolimit:autolimit:1.0.0-SNAPSHOT'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
