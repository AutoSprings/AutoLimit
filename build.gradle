plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.autolimit'
version = '1.0.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

repositories { mavenCentral() }

dependencies {
    constraints {
        // Patch the embedded container beyond Boot 3.5's final public BOM.
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.61'
        implementation 'org.apache.tomcat.embed:tomcat-embed-el:10.1.61'
        implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.61'
    }
    api platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.google.guava:guava:33.4.8-jre'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'short' }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
