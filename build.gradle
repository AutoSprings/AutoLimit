plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.autosprings'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.google.guava:guava:33.4.8-jre'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'short' }
}

mavenPublishing {
    coordinates(project.group.toString(), 'autolimit', project.version.toString())
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'AutoLimit'
        description = 'An annotation-based, in-memory rate-limiting library for Java 21 and Spring Boot 4 servlet applications.'
        url = 'https://github.com/AutoSprings/AutoLimit'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'autosprings'
                name = 'AutoSprings Team'
                url = 'https://github.com/AutoSprings'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/AutoSprings/AutoLimit.git'
            developerConnection = 'scm:git:ssh://git@github.com/AutoSprings/AutoLimit.git'
            url = 'https://github.com/AutoSprings/AutoLimit'
        }
    }
}
