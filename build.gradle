plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.autolimit'
version = '1.0.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

repositories { mavenCentral() }

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.2.4')
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.2.4')
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'short' }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
